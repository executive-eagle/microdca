name: Update prices & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *' # after US market close (stock/ETF closes)
    - cron: '15 0 * * *'  # just after the UTC daily bitcoin close
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Fetch latest prices (keeps old data if a source fails)
        run: npm run fetch-prices

      - name: Commit updated prices
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data/prices.json; then echo "No price changes"; exit 0; fi
          git config user.name "microdca-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json
          git commit -m "Update prices $(date -u +%F)"
          git push

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
